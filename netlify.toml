# Netlify configuration — Smart Accounting Solutions
# Static Astro build + a preview password gate (netlify/edge-functions/preview-gate.ts,
# auto-discovered via its in-file `config.path`). Push to `main` auto-deploys.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Indexing is OFF by default (preview). Set PUBLIC_INDEXABLE = "true" in the Netlify
  # UI at launch to allow indexing (flips robots.txt + removes the site-wide noindex).
  # SITE_URL is set in the UI to the real domain at launch (drives canonicals/sitemap).

# Baseline security headers (playbook §11 pre-launch).
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"

# Cache policy (GTmetrix/PSI "efficient cache policy"). Everything under /_astro/
# is content-hashed by the build, so it is safe to cache for a year, immutable.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Unhashed static assets (logos, software marks, icons, OG image): one week +
# a day of stale-while-revalidate. Version the filename when swapping any of
# these (playbook §5).
[[headers]]
  for = "/logos/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/software/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/og-default.jpg"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/apple-touch-icon.png"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/favicon-32.png"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"
